# =============================================================================
# 番茄小说下载器前端 — Nginx 配置范例
#
# 使用说明：
#   1. 把 fq.example.com 换成你的域名
#   2. 把 /www/wwwroot/fq.example.com/web 换成你的站点根目录（含 index.html）
#   3. 把证书路径换成你自己的（或先只保留 80 端口，用 acme.sh / 面板申请后再加）
#   4. nginx -t && nginx -s reload
#
# 关键点（容易踩坑，务必注意）：
#   - root 必须指向「存放 index.html 的目录」，静态资源需在该目录的 assets/ 下
#   - /api/manage/ 必须写在 ^~ /api/ 之前，否则会被 /api/ 抢先反代到后端
#   - 后端与 sidecar 都只监听 127.0.0.1，公网只经本 Nginx
# =============================================================================

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    server_name fq.example.com;

    # ★ 改成存放 index.html 的目录
    root /www/wwwroot/fq.example.com/web;
    index index.html;

    # ★ 证书（用面板或 acme.sh 申请后填实际路径）
    ssl_certificate     /www/server/panel/vhost/cert/fq.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/fq.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 强制 HTTPS（如需保留纯 HTTP 访问，删掉这段）
    if ($server_port != 443) {
        return 301 https://$host$request_uri;
    }

    # ACME 验证目录（申请/续期证书用，勿删）
    location ^~ /.well-known/ {
        allow all;
    }

    # ── 删除服务 sidecar（可选，不部署就删掉这段）────────────────────
    # 必须放在 ^~ /api/ 之前！^~ 前缀匹配会短路后续正则与更短前缀
    location ^~ /api/manage/ {
        proxy_pass http://127.0.0.1:18425;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
    }

    # ── 后端 API ────────────────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18423;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        # 后端预留了 WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ── 文件下载（流式，超时放宽）───────────────────────────────────
    location ^~ /download/ {
        proxy_pass http://127.0.0.1:18423;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
    }

    location ^~ /download-zip/ {
        proxy_pass http://127.0.0.1:18423;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
    }

    # ── 前端静态资源（Vite 产物带内容 hash，可长缓存）────────────────
    # expires 会自动生成 Cache-Control: max-age，无需再手写 add_header
    location ^~ /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # ── SPA 入口：history 路由回退到 index.html（必需）──────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问敏感文件
    location ~* /(\.git|\.svn|\.env|node_modules|\.vscode)/ {
        return 404;
    }
    location ~* \.(env|log|sql|bak|old|tmp|swp)$ {
        return 404;
    }

    access_log /www/wwwlogs/fq.example.com.log;
    error_log  /www/wwwlogs/fq.example.com.error.log;
}
